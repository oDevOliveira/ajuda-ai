<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Ajuda.ai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main>
        <section class="cadastro-container">

            <div class="cadastro-header">
                <a href="{{ url_for('principal.portal') }}" class="logo">Ajuda<span>.ai</span></a>
                <h1>Crie sua conta</h1>
                <p>Faça parte do Ajuda.ai e comece a ajudar.</p>
            </div>

            {% if erro %}
                <div class="erro">
                    {{ erro }}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Como você gostaria de ser chamado?"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="bio">Bio <span>(opcional)</span></label>
                    <textarea
                        id="bio"
                        name="bio"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="foto_perfil">Foto de perfil <span>(opcional)</span></label>
                    <input
                        type="file"
                        id="foto_perfil"
                        name="foto_perfil"
                        accept="image/*"
                    >
                </div>

                <button type="submit">Criar minha conta</button>

            </form>

            <div class="cadastro-footer">
                <p>
                    Já possui uma conta?
                    <a href="{{ url_for('autenticacao.login') }}">Entrar</a>
                </p>
            </div>

        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
